<section class="release-intro wrap" aria-labelledby="releases-title">
  <p class="eyebrow">Llumi updates</p>
  <h1 id="releases-title">Release notes<span aria-hidden="true">.</span></h1>
  <div class="release-current">
    <span class="release-current-dot" aria-hidden="true"></span>
    <p>Latest public release <strong>macOS {{LATEST_PUBLIC_VERSION}}</strong></p>
    <a href="#release-history">View history <span aria-hidden="true">↓</span></a>
  </div>
</section>

<section class="release-preview-section wrap" aria-label="Unreleased preview">
  {{RELEASE_PREVIEW}}
  {{REVIEW_LINK}}
</section>

<section class="release-history wrap" id="release-history" aria-labelledby="release-history-title">
  <div class="release-section-heading">
    <h2 id="release-history-title">Release history</h2>
    <p>Published updates for macOS.</p>
  </div>
  <div class="release-timeline">
    {{RELEASE_HISTORY}}
  </div>
</section>
