name: Bug report
description: Report an Llumi problem on macOS or Windows.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not upload credentials, auth files, tokens, cookies, private prompts, source code, full terminal history or serial numbers. Review screenshots and diagnostics before attaching them."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Llumi version and installation source
      description: "For example, macOS 1.1.1 from GitHub, or Windows 2.0.2 from Microsoft Store."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version and architecture
      description: "Include Apple Silicon / Intel or Windows x64."
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Display setup
      description: "If relevant: notch, external displays, resolution and scaling. No serial numbers."
  - type: input
    id: provider
    attributes:
      label: Affected provider and CLI / desktop version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional sanitized screenshot or diagnostics
