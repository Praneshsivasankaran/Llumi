name: Llumi website validation
on:
  push:
    branches: [main, 'codex/llumi-public-launch']
    paths:
      - 'site/**'
      - 'PRIVACY.md'
      - 'scripts/build-site.py'
      - 'scripts/test-site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'PRIVACY.md'
      - 'scripts/build-site.py'
      - 'scripts/test-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentmeter-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build static pages
        run: python3 scripts/build-site.py
      - name: Check policy parity and site integrity
        run: python3 scripts/test-site.py
      - name: Public repository hygiene
        run: python3 scripts/check-public-tree.py
      - name: Canonical redirect checks
        run: node --test site/tests/routing.test.mjs
      - name: Install website validation tools
        run: |
          npm ci --prefix site/tests
          npx --prefix site/tests playwright install --with-deps chromium firefox webkit
      - name: Browser and accessibility validation
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site > /tmp/llumi-site-server.log 2>&1 &
          node site/tests/check.cjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
# Production deploys explicitly to Cloudflare. Historical /AgentMeter/ pages
# are independently preserved in the account's github.io compatibility site.
